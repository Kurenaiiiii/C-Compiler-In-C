name: Bug report
description: Report a miscompile, crash, or bad diagnostic
title: "[bug]: "
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducer
      description: Smallest C file that shows the problem, plus the exact ccc command used
      placeholder: |
        int main() { return 1 + 2; }
        ./ccc repro.c -o repro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What gcc (or the C standard) does with the same file
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Full ccc output, exit code, and `gcc` version comparison if any
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, architecture, gcc version, ccc commit hash
      placeholder: Fedora 44 x86-64, gcc 16, abc1234
    validations:
      required: false
